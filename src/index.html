<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <link rel="stylesheet" href="app.css">
  <script defer src="renderer.js"></script>
  <script defer src="ris-ui.js"></script>
  <title>EndNote ChatGPT</title>
</head>
<body>
  <header class="app-header">
    <div>
      <h1>EndNote ChatGPT</h1>
      <p>期刊论文检索、RIS 导出与全文入口</p>
    </div>
    <details id="account" class="account">
      <summary id="account-summary">连接 ChatGPT</summary>
      <div class="account-panel">
        <h2>ChatGPT 订阅额度</h2>
        <p id="account-status" role="status">登录 OpenAI 并授权使用你的 ChatGPT 套餐。</p>
        <p id="account-diagnostic" class="field-note" hidden></p>
        <div class="controls">
          <button id="login" class="primary" type="button">Continue with ChatGPT</button>
          <button id="logout" type="button" hidden>退出</button>
          <button id="models" type="button" hidden>刷新模型</button>
          <button id="usage" class="link" type="button">查看用量</button>
        </div>
        <label for="model" class="field-label">模型</label>
        <select id="model" disabled><option value="">请先登录</option></select>
        <p class="muted">生成译名会提交题名。核对候选时会提交相关文献字段。PDF 和笔记留在本机。</p>
      </div>
    </details>
  </header>

  <nav class="mode-switch" aria-label="工作方式">
    <button id="mode-ris" type="button" aria-pressed="true">标题转 RIS</button>
    <button id="mode-xml" type="button" aria-pressed="false">批量检查 XML</button>
  </nav>

  <main id="ris-workspace" class="ris-workspace">
    <form id="ris-form" class="ris-form">
      <label for="ris-title">论文标题或 DOI</label>
      <div class="ris-search-line">
        <input id="ris-title" type="search" maxlength="750" required autocomplete="off" placeholder="粘贴论文标题">
        <button id="ris-search" class="primary" type="submit">查找论文</button>
      </div>
      <div class="ris-options">
        <label><input type="checkbox" id="ris-translate" disabled> ChatGPT 生成译名</label>
        <label for="ris-language" class="visually-hidden">译名语言</label>
        <select id="ris-language"><option value="Simplified Chinese">简体中文</option><option value="English">英语</option></select>
        <button id="ris-cancel" type="button" hidden>停止查询</button>
      </div>
    </form>
    <p id="ris-status" class="ris-status" role="status" aria-live="polite"></p>
    <div id="ris-result" class="ris-result"></div>
  </main>

  <section id="xml-toolbar" class="toolbar" aria-label="文献检查操作" hidden>
    <button id="open" type="button">打开 EndNote XML</button>
    <button id="scan" class="primary" type="button" disabled>一键检查补全</button>
    <button id="cancel" type="button" hidden>停止检查</button>
    <button id="save" type="button" disabled>导出已选修改</button>
    <div class="translation-options">
      <label><input type="checkbox" id="translate" disabled> ChatGPT 补译名</label>
      <label for="language" class="visually-hidden">译名语言</label>
      <select id="language">
        <option value="Simplified Chinese">简体中文</option>
        <option value="English">英语</option>
      </select>
    </div>
  </section>
  <div id="xml-status" class="task-status" hidden role="status" aria-live="polite">
    <span id="notice">从 EndNote 导出所选条目为 XML，然后在这里打开。</span>
    <progress id="progress" max="1" value="0" hidden></progress>
  </div>

  <main id="xml-workspace" class="workspace" hidden>
    <aside class="library" aria-label="文献列表">
      <div class="panel-heading"><h2>文献列表</h2><span id="count">0 条</span></div>
      <ul id="records" class="records"></ul>
    </aside>
    <section class="review" id="review" aria-label="核对结果">
      <div class="empty">
        <h2>检查结果</h2>
        <p>打开 XML 后，点击「一键检查补全」，再核对有差异的字段。</p>
      </div>
    </section>
  </main>
</body>
</html>
